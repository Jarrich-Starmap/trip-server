# your-api.example.com —— ACME 引导配置（仅在证书签发前临时生效）
# 作用：让 certbot 的 HTTP-01 校验能通过 http://your-api.example.com/.well-known/acme-challenge/ 拿到令牌。
# 证书签发成功后由 deploy.sh 替换为完整 HTTPS 配置（nginx.your-api.example.com.conf）并删除本文件。
server {
    listen 80;
    server_name your-api.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 200 'kids-trip bootstrap'; }
}
