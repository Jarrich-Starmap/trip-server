# your-api.example.com —— 独立子域名，与 your-server.example.com 完全隔离
# （本文件为新增，不修改任何现有 nginx 站点）
#
# 部署：
#   1) 确保 DNS：your-api.example.com A 记录指向本服务器
#   2) sudo cp deploy/nginx.your-api.example.com.conf /etc/nginx/conf.d/
#   3) sudo certbot certonly --webroot -w /var/www/certbot -d your-api.example.com
#   4) sudo nginx -t && sudo systemctl reload nginx

# HTTP → HTTPS 重定向 + ACME 校验
server {
    listen 80;
    server_name your-api.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name your-api.example.com;

    # certbot 签发的证书（独立子域，与 your-server.example.com 是不同 cert）
    ssl_certificate     /etc/letsencrypt/live/your-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-api.example.com/privkey.pem;
    include /etc/nginx/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;   # 攻略/评论均为文本，限制上传体积防滥用

    # 健康检查（pm2 探活、外部监控；不写 access log 减噪）
    location = /healthz {
        proxy_pass http://127.0.0.1:8099/healthz;
        access_log off;
    }

    # 主代理：全部流量转发到 pm2 托管的 node（仅环回 127.0.0.1:8099）
    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
