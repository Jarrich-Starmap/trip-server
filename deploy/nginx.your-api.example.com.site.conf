# your-api.example.com —— 生产站点配置（由 deploy 覆盖 /etc/nginx/sites-available/your-api.example.com）
# 复用既有已签发证书 /etc/nginx/ssl/your-api.example.com_*.pem（不由 certbot 重新签发）。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-api.example.com;

    ssl_certificate     /etc/nginx/ssl/your-api.example.com_fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/your-api.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 1m;

    location = /healthz {
        proxy_pass http://127.0.0.1:8099/healthz;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name your-api.example.com;
    # 预留 ACME 校验（证书续期用；当前云安全组未放通 80，续期时需临时放通或用 DNS-01）
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
